<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Pro - Luxury Navy & Gold Barcode Scanner</title>
    <!-- QuaggaJS Library for Barcode Scanning -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        :root {
            --bg-navy: #0a0f1d;
            --card-navy: #131b2e;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa8c2c;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-navy);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-navy);
            border: 1px solid var(--gold-primary);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(212, 175, 55, 0.15);
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            color: var(--gold-primary);
            font-size: 1.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        #interactive.viewport {
            position: relative;
            width: 100%;
            height: 300px;
            border: 2px solid var(--gold-dark);
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            margin-bottom: 20px;
        }

        #interactive.viewport canvas, canvas.drawing, canvas.drawingBuffer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        #btn-start {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            color: var(--bg-navy);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        #btn-start:hover {
            opacity: 0.9;
        }

        #btn-stop {
            background: transparent;
            border: 1px solid #ef4444;
            color: #ef4444;
        }

        #btn-stop:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .result-box {
            background: rgba(10, 15, 29, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
        }

        .result-box h3 {
            color: var(--gold-light);
            font-size: 0.9rem;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        #result-output {
            color: var(--text-main);
            font-size: 1.1rem;
            font-family: monospace;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Trading Pro Scanner</h1>
            <p class="subtitle">Luxury Barcode Verification System</p>
        </header>

        <!-- Viewport Scanner Camera -->
        <div id="interactive" class="viewport"></div>

        <div class="controls">
            <button id="btn-start" onclick="startScanner()">Mulai Pindai</button>
            <button id="btn-stop" onclick="stopScanner()">Hentikan</button>
        </div>

        <div class="result-box">
            <h3>Hasil Pemindaian:</h3>
            <div id="result-output">Menunggu pemindaian...</div>
        </div>
    </div>

    <script>
        let isRunning = false;

        function startScanner() {
            if (isRunning) return;

            Quagga.init({
                inputStream: {
                    name: "Live",
                    type: "LiveStream",
                    target: document.querySelector('#interactive'),
                    constraints: {
                        facingMode: "environment" // Menggunakan kamera belakang HP
                    },
                },
                decoder: {
                    readers: [
                        "code_128_reader",
                        "ean_reader",
                        "ean_8_reader",
                        "code_39_reader",
                        "upc_reader"
                    ]
                },
                locate: true
            }, function(err) {
                if (err) {
                    console.error(err);
                    alert("Gagal mengaktifkan kamera: " + err);
                    return;
                }
                Quagga.start();
                isRunning = true;
                document.getElementById('result-output').innerText = "Kamera aktif, arahkan ke barcode...";
            });

            Quagga.onDetected(function(result) {
                var code = result.codeResult.code;
                document.getElementById('result-output').innerText = code;
                
                // Opsional: Bunyi beep atau getar saat sukses mendeteksi
                if (navigator.vibrate) {
                    navigator.vibrate(200);
                }
            });
        }

        function stopScanner() {
            if (!isRunning) return;
            Quagga.stop();
            isRunning = false;
            document.getElementById('result-output').innerText = "Pemindaian dihentikan.";
        }
    </script>
</body>
</html>
